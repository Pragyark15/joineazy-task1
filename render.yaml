# Render Blueprint: one Docker web service (API + built SPA) and a managed PostgreSQL database.
services:
  - type: web
    name: joineazy-task1
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: joineazy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SIGNUP_CODE
        value: PROF-2026
      - key: CORS_ORIGIN
        value: https://joineazy-task1.onrender.com

databases:
  - name: joineazy-db
    plan: free
    databaseName: joineazy
